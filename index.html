<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>兔猫英语小镇 · 3–6岁免费手机点读乐园（EP001–EP015 全收录）</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
    background:#FFF6E5;color:#2E4540;display:flex;justify-content:center;
  }
  .wrap{
    width:100%;max-width:500px;min-height:100vh;padding:16px 14px 40px;
    background:linear-gradient(180deg,#FFFBF2 0%,#FDEED2 100%);
  }
  .hero{
    background:#FFFFFF;border-radius:26px;padding:18px 18px 16px;
    border:2px solid #F2DFBD;box-shadow:0 10px 26px rgba(89,50,22,0.08);
    position:relative;overflow:hidden;
  }
  .pill{
    display:inline-block;background:#2E4540;color:#FFF8EA;
    font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;
  }
  .hero h1{margin:10px 0 6px;font-size:23px;line-height:1.25;font-weight:900;color:#2E4540}
  .hero p{margin:0;font-size:12.5px;line-height:1.55;color:#665442;max-width:65%}
  .hero-stats{display:flex;gap:8px;margin-top:10px;position:relative;z-index:2}
  .hs{background:#FFF6E3;border:1.5px solid #EFE0C2;border-radius:12px;padding:5px 10px;font-size:12px;font-weight:800;color:#593216}
  .hs b{color:#D46B27}
  .mascots{
    position:absolute;right:4px;bottom:4px;display:flex;align-items:flex-end;pointer-events:none;
  }
  .mascots img.r{height:110px;object-fit:contain;transform:translateX(10px)}
  .mascots img.c{height:88px;object-fit:contain}

  .filters{
    display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none}
  .f-btn{
    flex-shrink:0;border:2px solid #EBD8B7;background:#FFFDF8;color:#593216;
    font-size:13px;font-weight:800;padding:7px 14px;border-radius:999px;cursor:pointer;
    transition:all 0.15s;
  }
  .f-btn.active{background:#2E4540;color:#FFF8EA;border-color:#2E4540}

  .sec-title{
    margin:12px 4px 10px;font-size:15px;font-weight:900;color:#2E4540;
    display:flex;justify-content:space-between;align-items:center;
  }
  .sec-title span{font-size:12px;font-weight:700;color:#9A6B3A}

  .ep-list{display:flex;flex-direction:column;gap:12px}
  .ep-card{
    background:#FFFFFF;border-radius:22px;padding:14px 15px;
    border:2px solid #EFE0C2;box-shadow:0 6px 18px rgba(89,50,22,0.07);
    transition:transform 0.15s;
  }
  .ep-card.featured{border:2.5px solid #F5B952;box-shadow:0 10px 24px rgba(212,107,39,0.14)}
  .ep-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ep-left{display:flex;align-items:center;gap:8px;min-width:0}
  .ep-badge{
    font-size:12px;font-weight:900;padding:4px 10px;border-radius:10px;flex-shrink:0;
  }
  .ep-title{font-size:17px;font-weight:900;color:#2E4540;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ep-island{font-size:11px;font-weight:800;color:#7A644B;background:#F8F3E8;padding:3px 9px;border-radius:999px;flex-shrink:0}
  .ep-words{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 11px}
  .w-chip{
    background:#FFF9EE;border:1px solid #EFE0C2;color:#593216;
    font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;
  }
  .btn-row{display:flex;gap:8px}
  .btn{
    text-decoration:none;text-align:center;font-size:13.5px;font-weight:900;
    padding:10px 12px;border-radius:14px;flex:1;display:block;
  }
  .btn-primary{background:#2E4540;color:#FFF8EA}
  .btn-secondary{background:#FFF3DC;color:#593216;border:1.5px solid #EBD0A1;flex:0.8}

  .soon{
    margin-top:14px;background:rgba(255,255,255,0.75);border:2px dashed #DECAA6;
    border-radius:20px;padding:14px;text-align:center;font-size:13px;color:#6E5A45;
  }
  .soon b{color:#2E4540;font-size:14px;display:block;margin-bottom:4px}

  .notice{
    margin-top:16px;background:rgba(46,69,64,0.06);border-radius:18px;padding:14px;
    font-size:12px;line-height:1.65;color:#52615B;
  }
  .notice b{color:#2E4540}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="pill">🌿 3–6岁低刺激护眼慢英语</div>
    <h1>兔猫英语小镇<br>手机点读乐园</h1>
    <p>同步小红书 300 集绘本动画 · 真人词典发音 · 宝宝戳屏幕就能听能闯关</p>
    <div class="hero-stats">
      <div class="hs">已上线 <b>15</b> 集</div>
      <div class="hs">共 <b id="wordCount">78</b> 个高频词</div>
    </div>
    <div class="mascots">
      <img class="r" src="./img/rabbit.png" alt="折折兔">
      <img class="c" src="./img/cat.png" alt="团团猫">
    </div>
  </div>

  <div class="filters" id="filterBar"></div>

  <div class="sec-title">
    <span id="listHeading" style="font-size:15px;color:#2E4540">📚 全部已上线课程（EP001–EP015）</span>
    <span id="doneStats">点击即可点读</span>
  </div>

  <div class="ep-list" id="epList"></div>

  <div class="soon">
    <b>🔜 下一集 EP016《认识位置》制作中</b>
    in / on / under / next to · 关注小红书【兔猫英语小镇】追更解锁！
  </div>

  <div class="notice">
    <b>💡 家长使用小贴士：</b><br>
    1. 点击任意一集即可进入<b>【点一点学英语】</b>与<b>【听一听无剧透闯关】</b>（iPhone 请先关闭侧边静音键）；<br>
    2. 建议和孩子一起玩，听完提问后<b>留足 3 秒</b>让孩子自己思考点图，不催促不抢答！
  </div>
</div>

<script src="./data/episodes.js"></script>
<script>
const EPS = window.TUMAO_EPISODES || [];
const ISLANDS = ["全部", "基础认知", "身体日常", "家园出行", "美味餐桌", "情商社交", "自然探索"];
let activeIsland = "全部";

const totalWords = EPS.reduce((s, e) => s + e.items.length, 0);
document.getElementById("wordCount").textContent = totalWords;

function getDoneSet() {
  try { return new Set(JSON.parse(localStorage.getItem("tumao_done_eps") || "[]")); }
  catch { return new Set(); }
}

function renderFilters() {
  const bar = document.getElementById("filterBar");
  bar.innerHTML = "";
  ISLANDS.forEach(isl => {
    const cnt = isl === "全部" ? EPS.length : EPS.filter(e => e.island === isl).length;
    const btn = document.createElement("button");
    btn.className = "f-btn" + (isl === activeIsland ? " active" : "");
    btn.textContent = `${isl} (${cnt})`;
    btn.onclick = () => { activeIsland = isl; renderFilters(); renderList(); };
    bar.appendChild(btn);
  });
}

function renderList() {
  const doneSet = getDoneSet();
  const list = document.getElementById("epList");
  list.innerHTML = "";
  const shown = activeIsland === "全部"
    ? [...EPS].reverse()  // 最新期置顶，同时 EP001-EP015 全部一览无余
    : EPS.filter(e => e.island === activeIsland).reverse();

  document.getElementById("listHeading").textContent =
    activeIsland === "全部" ? `📚 全部已上线（${shown.length} 集，最新在前）` : `🏝️ ${activeIsland}（${shown.length} 集）`;
  document.getElementById("doneStats").textContent =
    doneSet.size > 0 ? `已通关 ${doneSet.size}/${EPS.length} 集 ⭐` : "点击即玩";

  shown.forEach((ep, idx) => {
    const isLatest = ep.id === "EP015";
    const isDone = doneSet.has(ep.id);
    const wordsHtml = ep.items.slice(0, 6).map(i => `<span class="w-chip">${i.word} ${i.zh}</span>`).join("")
      + (ep.items.length > 6 ? `<span class="w-chip">+${ep.items.length - 6} 词</span>` : "");

    const wsBtn = ep.worksheet
      ? `<a class="btn btn-secondary" href="${ep.worksheet}" download="兔猫英语小镇-${ep.id}-亲子涂色纸.jpg">🖨️ 涂色纸</a>`
      : "";

    const card = document.createElement("div");
    card.className = "ep-card" + (isLatest ? " featured" : "");
    card.innerHTML = `
      <div class="ep-top">
        <div class="ep-left">
          <span class="ep-badge" style="background:${ep.color};color:${ep.ink}">${ep.id}</span>
          <span class="ep-title">${ep.title} · ${ep.en}</span>
        </div>
        <span class="ep-island">${isDone ? "✅ 已通关" : (isLatest ? "🔥 最新" : ep.island)}</span>
      </div>
      <div class="ep-words">${wordsHtml}</div>
      <div class="btn-row">
        <a class="btn btn-primary" href="./play.html?ep=${ep.id}">👆 点读与闯关（${ep.items.length}词）</a>
        ${wsBtn}
      </div>
    `;
    list.appendChild(card);
  });
}

renderFilters();
renderList();
</script>
</body>
</html>
