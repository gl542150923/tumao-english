<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>兔猫英语小镇 · 点读与闯关</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{
    margin:0;min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
    background:#FFF6E5;color:#2E4540;display:flex;justify-content:center;
  }
  .app{
    width:100%;max-width:480px;min-height:100vh;
    background:linear-gradient(180deg,#FFF9ED 0%,#FDECD0 100%);
    display:flex;flex-direction:column;position:relative;overflow-x:hidden;
    box-shadow:0 0 40px rgba(89,50,22,0.12);
  }
  .header{
    padding:12px 14px 10px;display:flex;justify-content:space-between;align-items:center;
    background:rgba(255,255,255,0.9);backdrop-filter:blur(8px);
    border-bottom:2px solid #F3DFC1;z-index:10;gap:8px;
  }
  .back-btn{
    text-decoration:none;background:#FFF0D1;color:#593216;font-size:13px;font-weight:900;
    padding:6px 12px;border-radius:999px;flex-shrink:0;
  }
  .head-title{font-weight:900;font-size:15px;color:#2E4540;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tip-btn{
    border:none;background:#2E4540;color:#FFF8EA;font-size:12px;font-weight:700;
    padding:6px 11px;border-radius:999px;cursor:pointer;flex-shrink:0;
  }

  .mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 8px}
  .tab{
    border:2px solid #EBD3AE;background:#FFFDF8;color:#593216;
    font-size:14.5px;font-weight:800;padding:10px 8px;border-radius:15px;cursor:pointer;
  }
  .tab.active{background:#2E4540;color:#FFF8EA;border-color:#2E4540;box-shadow:0 6px 14px rgba(46,69,64,0.2)}

  .stage{
    margin:4px 14px 10px;border-radius:24px;overflow:hidden;position:relative;
    background-size:cover;background-position:center;
    border:3px solid #FFFFFF;box-shadow:0 10px 26px rgba(89,50,22,0.12);
    flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:480px;
  }
  .stage-veil{
    position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,248,234,0.85) 0%,rgba(255,248,234,0.38) 42%,rgba(255,248,234,0.22) 100%);
    pointer-events:none;
  }
  .prompt-bar{
    position:relative;z-index:2;margin:12px 12px 0;
    background:rgba(255,255,255,0.94);border:2px solid #F2D7A8;
    border-radius:18px;padding:10px 12px;text-align:center;
    box-shadow:0 6px 16px rgba(89,50,22,0.08);
  }
  .prompt-title{font-size:18px;font-weight:900;color:#2E4540}
  .prompt-sub{font-size:12.5px;color:#6E5438;margin-top:3px;font-weight:600}
  .replay-btn{
    margin-top:7px;border:none;background:#E8873E;color:#fff;
    font-size:12.5px;font-weight:800;padding:6px 14px;border-radius:999px;cursor:pointer;
  }
  .stars{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin-top:6px;font-size:17px}
  .star{opacity:0.25;transition:all 0.25s;display:inline-block}
  .star.lit{opacity:1;transform:scale(1.18)}

  .cards{
    position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:10px;padding:12px;margin:auto 0;
  }
  .card{
    background:rgba(255,253,247,0.95);border:3px solid #F0DFC1;
    border-radius:20px;padding:12px 8px;min-width:0;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:150px;cursor:pointer;position:relative;
    box-shadow:0 8px 18px rgba(89,50,22,0.1);
    transition:transform 0.16s,border-color 0.2s;
  }
  .card:active{transform:scale(0.95)}
  .card.pop{animation:bounce 0.5s ease}
  .card.correct{border-color:#F5A623;background:#FFF9E6;box-shadow:0 0 0 5px rgba(245,166,35,0.28)}
  .card.wrong{animation:shake 0.35s ease;border-color:#E57373}
  .card svg{max-width:100%;height:auto;display:block}
  .emoji-art{font-size:64px;line-height:1.1;filter:drop-shadow(0 5px 6px rgba(89,50,22,0.16))}
  .duck-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:130px;font-size:24px;line-height:1.15}
  .word-pill{
    margin-top:8px;padding:4px 12px;border-radius:999px;
    background:#FFF1D6;color:#593216;font-size:15px;font-weight:900;transition:opacity 0.2s;
  }
  .zh-label{font-size:12px;color:#7B6248;margin-top:2px;font-weight:700;transition:opacity 0.2s}
  .hidden{opacity:0;pointer-events:none}
  .audio-chip{
    position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;
    background:#FFF0D1;color:#C4641B;font-size:12px;
    display:flex;align-items:center;justify-content:center;
  }

  .actors{
    position:relative;z-index:2;display:flex;justify-content:space-between;
    align-items:flex-end;padding:0 10px 6px;pointer-events:none;
  }
  .actors img{height:102px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,0.2));transition:transform 0.2s}
  .actors img.talk{transform:translateY(-6px) scale(1.04)}
  .speech-bubble{
    background:#2E4540;color:#FFF8EA;font-size:12.5px;font-weight:700;
    padding:8px 12px;border-radius:15px;margin-bottom:16px;max-width:185px;text-align:center;
  }

  .nav-bar{
    display:flex;justify-content:space-between;gap:10px;padding:2px 14px 16px;
  }
  .nav-link{
    flex:1;text-decoration:none;text-align:center;background:#FFFFFF;border:2px solid #EAD8B8;
    color:#2E4540;font-size:13px;font-weight:800;padding:10px;border-radius:14px;
  }
  .nav-link.disabled{opacity:0.4;pointer-events:none}

  .modal{
    position:fixed;inset:0;background:rgba(46,69,64,0.62);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal.open{display:flex}
  .modal-card{
    background:#FFFDF8;border-radius:24px;padding:22px 18px;max-width:360px;width:100%;
    text-align:center;border:3px solid #F5C477;
  }
  .modal-card h2{margin:6px 0 10px;color:#2E4540;font-size:22px}
  .modal-card p{font-size:14px;line-height:1.65;color:#5A4A3A;text-align:left}
  .primary-btn{
    margin-top:12px;width:100%;border:none;background:#2E4540;color:#FFF8EA;
    font-size:15px;font-weight:800;padding:11px;border-radius:14px;cursor:pointer;
  }

  @keyframes bounce{0%,100%{transform:scale(1)}35%{transform:scale(1.07) translateY(-5px)}70%{transform:scale(0.97)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .confetti{position:fixed;pointer-events:none;z-index:60;font-size:20px;animation:fall 0.85s ease-out forwards}
  @keyframes fall{0%{opacity:1;transform:translate(0,0) scale(0.8)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.25) rotate(180deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <a class="back-btn" href="./index.html">← 全部15集</a>
    <div id="headTitle" class="head-title">加载中...</div>
    <button class="tip-btn" onclick="openTips()">👨‍👩‍👧 陪玩卡</button>
  </div>

  <div class="mode-tabs">
    <button id="tabExplore" class="tab active" onclick="setMode('explore')">👆 点一点学英语</button>
    <button id="tabQuiz" class="tab" onclick="setMode('quiz')">🎯 听一听闯关</button>
  </div>

  <div class="stage" id="stage">
    <div class="stage-veil"></div>
    <div class="prompt-bar">
      <div id="promptTitle" class="prompt-title">点一点卡片，听真人发音！</div>
      <div id="promptSub" class="prompt-sub">点一下听词典发音，再听例句</div>
      <div id="quizControls" style="display:none">
        <div class="stars" id="starRow"></div>
        <button class="replay-btn" onclick="playCurrentQuiz()">🔊 再听一遍提问</button>
      </div>
    </div>

    <div class="cards" id="cardGrid"></div>

    <div class="actors">
      <img id="imgRabbit" src="./img/rabbit.png" alt="折折兔">
      <div id="bubble" class="speech-bubble">快点卡片听发音吧！</div>
      <img id="imgCat" src="./img/cat.png" alt="团团猫">
    </div>
  </div>

  <div class="nav-bar">
    <a id="prevLink" class="nav-link" href="#">← 上一集</a>
    <a id="nextLink" class="nav-link" href="#">下一集 →</a>
  </div>
</div>

<div class="modal" id="winModal">
  <div class="modal-card">
    <div style="font-size:52px">🏆✨</div>
    <h2>太棒啦！本集全对通关！</h2>
    <p id="winText" style="text-align:center"></p>
    <button class="primary-btn" onclick="closeWinAndRestart()">再玩一次 🎉</button>
    <button class="primary-btn" style="background:#F5C477;color:#593216;margin-top:8px" onclick="location.href='./index.html'">返回乐园选下一集 🗺️</button>
  </div>
</div>

<div class="modal" id="tipsModal">
  <div class="modal-card">
    <div style="font-size:34px">💡</div>
    <h2>本期 · 不费妈亲子陪玩卡</h2>
    <p id="tipContent"></p>
    <button class="primary-btn" onclick="closeTips()">学会了，去陪娃玩！</button>
  </div>
</div>

<script src="./data/episodes.js"></script>
<script>
const EPS = window.TUMAO_EPISODES || [];
const params = new URLSearchParams(location.search);
const epId = params.get("ep") || "EP015";
const epIdx = Math.max(0, EPS.findIndex(e => e.id === epId));
const EP = EPS[epIdx] || EPS[EPS.length - 1];

document.title = `兔猫英语小镇 ${EP.id} · ${EP.title}`;
document.getElementById("headTitle").textContent = `${EP.id} ${EP.title}`;
document.getElementById("stage").style.backgroundImage = `url('./${EP.bg}')`;
document.getElementById("tipContent").innerHTML = `<b>生活复现玩法：</b>${EP.tip}<br><br><b>3 秒留白秘诀：</b>闯关模式刻意隐藏了中英文答案，请耐心等孩子思考 3 秒再鼓励点击！`;

const prevLink = document.getElementById("prevLink");
const nextLink = document.getElementById("nextLink");
if (epIdx > 0) { prevLink.href = `./play.html?ep=${EPS[epIdx - 1].id}`; prevLink.textContent = `← ${EPS[epIdx - 1].id} ${EPS[epIdx - 1].title}`; }
else { prevLink.classList.add("disabled"); prevLink.textContent = "已是第 1 集"; }
if (epIdx < EPS.length - 1) { nextLink.href = `./play.html?ep=${EPS[epIdx + 1].id}`; nextLink.textContent = `${EPS[epIdx + 1].id} ${EPS[epIdx + 1].title} →`; }
else { nextLink.classList.add("disabled"); nextLink.textContent = "EP016 敬请期待"; }

let currentAudio = null;
let mode = "explore";
let quizIdx = 0;
let quizLocked = false;
let quizOrder = [];

function renderVisual(icon) {
  if (icon.startsWith("emoji:")) {
    return `<div class="emoji-art">${icon.slice(6)}</div>`;
  }
  if (icon.startsWith("balloon:")) {
    const col = icon.slice(8);
    return `<svg width="94" height="104" viewBox="0 0 100 115">
      <ellipse cx="50" cy="46" rx="34" ry="40" fill="${col}" stroke="rgba(0,0,0,0.18)" stroke-width="3"/>
      <ellipse cx="38" cy="32" rx="9" ry="14" fill="rgba(255,255,255,0.38)" transform="rotate(-18 38 32)"/>
      <polygon points="44,86 56,86 50,93" fill="${col}"/>
      <path d="M50 93 Q44 103 52 112" fill="none" stroke="#8C6D46" stroke-width="2.5"/>
    </svg>`;
  }
  if (icon.startsWith("ducks:")) {
    const n = parseInt(icon.slice(6), 10);
    return `<div class="duck-grid">${"🐥".repeat(n)}</div>`;
  }
  if (icon.startsWith("shape:")) {
    const sh = icon.slice(6);
    if (sh === "circle") return `<svg width="96" height="96" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#F07B3F" stroke="#8F3F14" stroke-width="4"/></svg>`;
    if (sh === "square") return `<svg width="96" height="96" viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="10" fill="#4BA3E3" stroke="#1E5B8A" stroke-width="4"/></svg>`;
    if (sh === "triangle") return `<svg width="96" height="96" viewBox="0 0 100 100"><polygon points="50,12 88,84 12,84" fill="#43B581" stroke="#1D6946" stroke-width="4" stroke-linejoin="round"/></svg>`;
    if (sh === "rectangle") return `<svg width="116" height="96" viewBox="0 0 120 100"><rect x="10" y="24" width="100" height="52" rx="10" fill="#9B7EDE" stroke="#4D3585" stroke-width="4"/></svg>`;
    return `<svg width="96" height="96" viewBox="0 0 100 100"><polygon points="50,8 62,36 92,38 69,58 76,88 50,72 24,88 31,58 8,38 38,36" fill="#F7C23C" stroke="#9C710E" stroke-width="4" stroke-linejoin="round"/></svg>`;
  }
  if (icon.startsWith("comp:")) {
    const k = icon.slice(5);
    if (k === "big") return `<svg width="108" height="108" viewBox="0 0 120 120"><defs><radialGradient id="gb" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#FF9A76"/><stop offset="60%" stop-color="#E5583B"/><stop offset="100%" stop-color="#B93822"/></radialGradient></defs><ellipse cx="60" cy="108" rx="42" ry="8" fill="rgba(89,50,22,0.18)"/><circle cx="60" cy="58" r="46" fill="url(#gb)" stroke="#8F2816" stroke-width="3"/><path d="M18 52 Q60 72 102 52" fill="none" stroke="#FFE29A" stroke-width="12" stroke-linecap="round" opacity="0.9"/><circle cx="44" cy="40" r="8" fill="rgba(255,255,255,0.45)"/></svg>`;
    if (k === "small") return `<svg width="108" height="108" viewBox="0 0 120 120"><defs><radialGradient id="gs" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#FF9A76"/><stop offset="60%" stop-color="#E5583B"/><stop offset="100%" stop-color="#B93822"/></radialGradient></defs><ellipse cx="60" cy="100" rx="22" ry="5" fill="rgba(89,50,22,0.18)"/><circle cx="60" cy="74" r="23" fill="url(#gs)" stroke="#8F2816" stroke-width="2.5"/><path d="M39 71 Q60 81 81 71" fill="none" stroke="#FFE29A" stroke-width="6" stroke-linecap="round" opacity="0.9"/><circle cx="52" cy="65" r="4.5" fill="rgba(255,255,255,0.45)"/></svg>`;
    if (k === "long") return `<svg width="144" height="98" viewBox="0 0 180 110"><ellipse cx="90" cy="96" rx="80" ry="7" fill="rgba(89,50,22,0.16)"/><rect x="10" y="52" width="38" height="32" rx="7" fill="#3D7EA6" stroke="#224561" stroke-width="2.5"/><rect x="14" y="34" width="14" height="20" rx="4" fill="#E8873E" stroke="#224561" stroke-width="2.5"/><rect x="52" y="58" width="34" height="26" rx="6" fill="#5CA4C9" stroke="#224561" stroke-width="2.5"/><rect x="90" y="58" width="34" height="26" rx="6" fill="#5CA4C9" stroke="#224561" stroke-width="2.5"/><rect x="128" y="58" width="34" height="26" rx="6" fill="#5CA4C9" stroke="#224561" stroke-width="2.5"/><line x1="48" y1="74" x2="128" y2="74" stroke="#224561" stroke-width="3"/><circle cx="22" cy="86" r="8" fill="#F5C477" stroke="#224561" stroke-width="2.5"/><circle cx="40" cy="86" r="8" fill="#F5C477" stroke="#224561" stroke-width="2.5"/><circle cx="69" cy="86" r="7" fill="#F5C477" stroke="#224561" stroke-width="2.5"/><circle cx="107" cy="86" r="7" fill="#F5C477" stroke="#224561" stroke-width="2.5"/><circle cx="145" cy="86" r="7" fill="#F5C477" stroke="#224561" stroke-width="2.5"/></svg>`;
    return `<svg width="144" height="98" viewBox="0 0 180 110"><ellipse cx="90" cy="96" rx="42" ry="7" fill="rgba(89,50,22,0.16)"/><rect x="50" y="52" width="38" height="32" rx="7" fill="#3D7EA6" stroke="#224561" stroke-width="2.5"/><rect x="54" y="34" width="14" height="20" rx="4" fill="#E8873E" stroke="#224561" stroke-width="2.5"/><rect x="92" y="58" width="34" height="26" rx="6" fill="#5CA4C9" stroke="#224561" stroke-width="2.5"/><circle cx="62" cy="86" r="8" fill="#F5C477" stroke="#224561" stroke-width="2.5"/><circle cx="80" cy="86" r="8" fill="#F5C477" stroke="#224561" stroke-width="2.5"/><circle cx="109" cy="86" r="7" fill="#F5C477" stroke="#224561" stroke-width="2.5"/></svg>`;
  }
  return `<div class="emoji-art">⭐</div>`;
}

function setTalking(who, active) {
  const r = document.getElementById("imgRabbit");
  const c = document.getElementById("imgCat");
  r.src = (who === "rabbit" && active) ? "./img/rabbit-talk.png" : "./img/rabbit.png";
  c.src = (who === "cat" && active) ? "./img/cat-talk.png" : "./img/cat.png";
  r.classList.toggle("talk", who === "rabbit" && active);
  c.classList.toggle("talk", who === "cat" && active);
}

function playUrl(url, speaker, onEnd) {
  if (!url) { if (onEnd) onEnd(); return; }
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const a = new Audio("./" + url);
  currentAudio = a;
  setTalking(speaker, true);
  a.onended = () => { setTalking(speaker, false); if (onEnd) onEnd(); };
  a.onerror = () => { setTalking(speaker, false); if (onEnd) onEnd(); };
  a.play().catch(() => { setTalking(speaker, false); });
}

function burstConfetti(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const icons = ["⭐","✨","🎉","💛","🌟"];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement("span");
    s.className = "confetti";
    s.textContent = icons[i % icons.length];
    s.style.left = cx + "px"; s.style.top = cy + "px";
    const angle = (Math.PI * 2 * i) / 10, dist = 50 + Math.random() * 50;
    s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
    s.style.setProperty("--dy", Math.sin(angle) * dist - 20 + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

function renderExplore() {
  document.getElementById("promptTitle").textContent = `${EP.title} · 点一点听真人发音！`;
  document.getElementById("promptSub").textContent = "点一下听词典原声，再听折折兔读生活短句";
  document.getElementById("quizControls").style.display = "none";
  document.getElementById("bubble").textContent = `点点卡片学「${EP.title}」！`;
  const grid = document.getElementById("cardGrid");
  grid.innerHTML = "";
  EP.items.forEach(item => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="audio-chip">🔊</div>
      ${renderVisual(item.icon)}
      <div class="word-pill">${item.word}</div>
      <div class="zh-label">${item.zh}</div>
    `;
    div.onclick = () => {
      div.classList.remove("pop"); void div.offsetWidth; div.classList.add("pop");
      burstConfetti(div);
      document.getElementById("bubble").textContent = item.sentence;
      playUrl(item.dictAudio, "rabbit", () => {
        if (item.teachAudio) setTimeout(() => playUrl(item.teachAudio, "rabbit"), 220);
      });
    };
    grid.appendChild(div);
  });
}

function buildQuizOrder() {
  return EP.items.map((target, i) => {
    // 对 EP015 固定同组对比（球 vs 球，火车 vs 火车）
    let other;
    if (EP.id === "EP015") {
      const opp = { big: "small", small: "big", long: "short", short: "long" }[target.key];
      other = EP.items.find(x => x.key === opp);
    } else {
      const pool = EP.items.filter(x => x.key !== target.key);
      other = pool[(i * 2 + 1) % pool.length];
    }
    const pair = i % 2 === 0 ? [target, other] : [other, target];
    return { target, pair };
  });
}

function markEpisodeDone() {
  try {
    const s = new Set(JSON.parse(localStorage.getItem("tumao_done_eps") || "[]"));
    s.add(EP.id);
    localStorage.setItem("tumao_done_eps", JSON.stringify([...s]));
  } catch {}
}

function renderQuiz() {
  quizLocked = false;
  const q = quizOrder[quizIdx];
  document.getElementById("promptTitle").textContent = `第 ${quizIdx + 1} / ${quizOrder.length} 关 · 听一听，点一点！`;
  document.getElementById("promptSub").textContent = "先仔细听英文，再点正确的图（无文字剧透）";
  document.getElementById("quizControls").style.display = "block";
  document.getElementById("bubble").textContent = "仔细听团团猫找的是哪一个？";

  const starRow = document.getElementById("starRow");
  starRow.innerHTML = quizOrder.map((_, i) => `<span class="star ${i < quizIdx ? 'lit' : ''}">⭐</span>`).join("");

  const grid = document.getElementById("cardGrid");
  grid.innerHTML = "";
  q.pair.forEach(item => {
    const div = document.createElement("div");
    div.className = "card";
    div.style.minHeight = "188px";
    div.innerHTML = `
      ${renderVisual(item.icon)}
      <div class="word-pill hidden">${item.word}</div>
      <div class="zh-label hidden">${item.zh}</div>
    `;
    div.onclick = () => {
      if (quizLocked) return;
      if (item.key === q.target.key) {
        quizLocked = true;
        div.classList.add("correct", "pop");
        div.querySelector(".word-pill").classList.remove("hidden");
        div.querySelector(".zh-label").classList.remove("hidden");
        burstConfetti(div);
        document.getElementById("bubble").textContent = "✨ 答对啦！" + item.word + "!";
        starRow.children[quizIdx].classList.add("lit");
        playUrl("audio/correct.mp3", "cat", () => {
          playUrl(item.dictAudio, "rabbit", () => {
            setTimeout(() => {
              if (quizIdx < quizOrder.length - 1) {
                quizIdx++;
                renderQuiz();
              } else {
                markEpisodeDone();
                document.getElementById("winText").innerHTML = `宝宝已经全部听懂 <b>${EP.id}《${EP.title}》</b> 的 ${EP.items.length} 个核心英文词！获得兔猫小镇通关小星星！`;
                document.getElementById("winModal").classList.add("open");
              }
            }, 750);
          });
        });
      } else {
        div.classList.remove("wrong"); void div.offsetWidth; div.classList.add("wrong");
        document.getElementById("bubble").textContent = "再听一遍想想看哦～";
        playCurrentQuiz();
      }
    };
    grid.appendChild(div);
  });
  playCurrentQuiz();
}

function playCurrentQuiz() {
  const q = quizOrder[quizIdx];
  const src = q.target.quizAudio || q.target.dictAudio;
  playUrl(src, "cat");
}

function setMode(m) {
  mode = m;
  document.getElementById("tabExplore").classList.toggle("active", m === "explore");
  document.getElementById("tabQuiz").classList.toggle("active", m === "quiz");
  if (m === "explore") renderExplore();
  else { quizOrder = buildQuizOrder(); quizIdx = 0; renderQuiz(); }
}

function closeWinAndRestart() {
  document.getElementById("winModal").classList.remove("open");
  quizOrder = buildQuizOrder(); quizIdx = 0; renderQuiz();
}
function openTips() { document.getElementById("tipsModal").classList.add("open"); }
function closeTips() { document.getElementById("tipsModal").classList.remove("open"); }

renderExplore();
</script>
</body>
</html>
